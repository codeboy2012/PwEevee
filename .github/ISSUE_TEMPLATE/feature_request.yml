name: Feature request
description: Suggest a new capability or improvement for PwEevee.
title: '[Feature]: '
labels:
  - feature request
  - enhancement
body:
  - type: markdown
    attributes:
      value: "PwEevee v4 and later will introduce significantly more features and original enhancements beyond the existing upstream integrations. Use this form to describe one focused proposal.\n\nSearch existing feature requests before submitting."
  - type: input
    id: feature-title
    attributes:
      label: Feature title
      description: A short, descriptive name for the proposal.
      placeholder: e.g. Custom playback controls
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - New PwEevee functionality
        - Spotify customization
        - UI and design
        - Chroma integration
        - EeveeSpotify integration
        - App icon customization
        - Lyrics
        - Playback
        - Downloads
        - Performance
        - Compatibility
        - Developer tools
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem being addressed
      description: What limitation or friction should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it could work.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the user experience after it is implemented?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Example use case
      description: Walk through a concrete example.
    validations:
      required: true
  - type: markdown
    attributes:
      value: '> **Privacy:** Remove personal information before sharing. Never upload passwords, tokens, cookies, private keys, certificates, provisioning profiles, or account information. Redact device identifiers in screenshots and logs.'
  - type: upload
    id: visual-references
    attributes:
      label: Visual references
      description: Optional. Add mockups, screenshots, or a PDF that helps explain the proposal.
    validations:
      accept: .png,.jpg,.jpeg,.gif,.webp,.pdf
  - type: dropdown
    id: priority
    attributes:
      label: Priority or importance
      options:
        - Nice to have
        - Important
        - Critical for my workflow
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: target-release
    attributes:
      label: Is this intended for v4 or later?
      options:
        - v4
        - Later than v4
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing feature requests and did not find a duplicate.
          required: true
