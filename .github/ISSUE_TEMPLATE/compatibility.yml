name: Compatibility report
description: Report what works or does not work on a specific device, iOS version, and Spotify version.
title: '[Compatibility]: '
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: Use this form for both successful and unsuccessful compatibility results. Search existing compatibility reports before submitting.
  - type: input
    id: device-model
    attributes:
      label: Device model
      description: The device model or identifier.
      placeholder: e.g. iPhone SE (iPhone12,8)
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: Exact iOS version
      description: Include the full version number.
      placeholder: e.g. 17.6.1
    validations:
      required: true
  - type: input
    id: spotify-version
    attributes:
      label: Spotify version
      description: e.g. 9.1.90
    validations:
      required: true
  - type: input
    id: pweevee-version
    attributes:
      label: PwEevee version
      description: e.g. 3.1.6.1
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - Sideloading
        - Jailbreak
        - Other
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: working-components
    attributes:
      label: Working components
      description: Select every component that works.
      options:
        - All tested components work
        - PwEevee core
        - Chroma
        - EeveeSpotify
        - App icons
        - Downloads
        - Playback
        - Lyrics
        - UI customization
        - Other
        - Not sure
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: broken-components
    attributes:
      label: Broken components
      description: Select every component that does not work.
      options:
        - No broken components
        - PwEevee core
        - Chroma
        - EeveeSpotify
        - App icons
        - Downloads
        - Playback
        - Lyrics
        - UI customization
        - Other
        - Not sure
      multiple: true
    validations:
      required: true
  - type: textarea
    id: feature-availability
    attributes:
      label: Feature availability
      description: Optional. Note which features are present or missing.
  - type: textarea
    id: known-limitations
    attributes:
      label: Known limitations
      description: Optional. Describe limits that other users should expect.
  - type: textarea
    id: observations
    attributes:
      label: Additional observations
      description: Optional. Include anything else that affects compatibility.
  - type: markdown
    attributes:
      value: '> **Privacy:** Remove personal information before sharing. Never upload passwords, tokens, cookies, private keys, certificates, provisioning profiles, or account information. Redact device identifiers in screenshots and logs.'
  - type: upload
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional. Drag and drop images or attach a text/log/JSON file after redacting personal data.
    validations:
      accept: .png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing compatibility reports and did not find this configuration.
          required: true
        - label: I removed personal information, credentials, private keys, certificates, and signing files from this report.
          required: true
