name: Question / support
description: Ask a question about installing, configuring, or using PwEevee.
title: '[Question]: '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: Search existing issues and check the README and latest release notes before opening a question. Do not post credentials or private signing material.
  - type: dropdown
    id: category
    attributes:
      label: Question category
      options:
        - Installation
        - Configuration
        - Compatibility
        - Chroma
        - EeveeSpotify
        - Updates
        - Distribution
        - Development
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Relevant component
      options:
        - PwEevee
        - Chroma
        - EeveeSpotify
        - App icons
        - Other
        - Not sure
    validations:
      required: true
  - type: input
    id: pweevee-version
    attributes:
      label: PwEevee version
      description: Optional. The release you are using.
      placeholder: e.g. 3.1.6.1
  - type: input
    id: device-ios
    attributes:
      label: Device and iOS version
      description: Optional. Include when relevant.
      placeholder: e.g. iPhone SE (iPhone12,8), iOS 17.6.1
  - type: markdown
    attributes:
      value: '> **Privacy:** Remove personal information before sharing. Never upload passwords, tokens, cookies, private keys, certificates, provisioning profiles, or account information. Redact device identifiers in screenshots and logs.'
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you need help with and include relevant context.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Optional. List troubleshooting steps or searches.
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I checked the README, latest release notes, and existing issues.
          required: true
        - label: I removed personal information, credentials, private keys, certificates, and signing files from this report.
          required: true
