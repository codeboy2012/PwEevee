# Keep the committed website snapshot in step with GitHub.
#
# The *served* website is refreshed on the host that serves it, every fifteen
# minutes, by a cron job running `scripts/refresh-site.sh --publish` (see the
# "Who owns the schedule" section of docs/freshness.md). This workflow is the
# repository half of the same
# cycle: it runs the identical pipeline and commits the result, so the tree a
# fresh clone gets — website/data/*.json and the pages rendered from them — does
# not disagree with what the site is serving.
#
# Why the live site does not depend on this scheduler: GitHub runs `schedule`
# workflows on a best-effort basis and coalesces or delays them. On this
# repository the */15 cron has been observed to be served roughly every four to
# six hours, which is normal GitHub behaviour and unusable as a fifteen-minute
# promise. The cadence is therefore owned by the server-side cron; this workflow
# does the same work whenever GitHub actually runs it.
#
# Commit policy — a run that found the same releases and the same statistics
# commits nothing:
#   * scripts/refresh-site.sh refreshes release metadata, repository statistics
#     and the AltSource, re-renders every page, and validates the result with
#     website-tests.pl;
#   * data-digest.pl then compares the tree against the committed one with the
#     volatile bookkeeping removed (generated_at, release_data_generated_at,
#     fetched_at, stale_since, etag, verified_at, and the refresh instants the
#     rendered pages embed). Equal digests mean nothing observable changed, so
#     the working tree is restored and no commit is made.
#
# Fail-safe: an updater that cannot reach GitHub keeps the previous known-good
# values and marks them stale; a render or validation failure aborts the run
# before the commit, so a broken refresh can never overwrite a good snapshot.
# A release whose IPA cannot be read never touches the published app source —
# that path stays in appsource-update.yml.
#
# Least privilege: the only write this job can do is a content commit. No
# secrets are used or printed; the token reaches curl only through a 0600 config
# file inside PwHttp.

name: Website refresh

on:
  schedule:
    - cron: '*/15 * * * *'   # best effort on GitHub's scheduler — see above
  workflow_dispatch: {}       # manual refresh / troubleshooting

permissions:
  contents: write

concurrency:
  group: website-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site sources
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Note the digest of the committed tree
        id: before
        run: |
          set -eu
          D=$(bash scripts/refresh-site.sh --digest-only)
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "committed tree digest: $D"

      - name: Refresh release data, statistics, AltSource and pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Plain (non-strict) mode: when GitHub is unreachable the updaters keep
          # the previous known-good values, mark them stale and exit 0, so the
          # site renders an honest stale state rather than losing data. A render
          # or validation failure still fails the step and nothing is committed.
          bash scripts/refresh-site.sh --status-file "$RUNNER_TEMP/refresh-status.json"
          echo "--- run record ---"
          cat "$RUNNER_TEMP/refresh-status.json"

      - name: Commit only when something observable changed
        run: |
          set -eu
          AFTER=$(bash scripts/refresh-site.sh --digest-only)
          BEFORE='${{ steps.before.outputs.digest }}'

          if [ "$BEFORE" = "$AFTER" ]; then
            echo "No observable change since the committed snapshot (digest $AFTER) — nothing to commit."
            # The pages were re-rendered from the same facts; keep the committed
            # bytes rather than committing refresh timestamps alone.
            git checkout -- website
            exit 0
          fi

          echo "Observable change: $BEFORE -> $AFTER"
          REL=$(python3 -c "import json,sys; print(json.load(open('$RUNNER_TEMP/refresh-status.json')).get('release') or 'unknown')")
          git config user.name  "pweevee-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add website
          git commit -m "data(site): refresh website snapshot from GitHub (PwEevee release $REL)"
          git push origin main
