<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PwEevee">
  <!-- Original PwEevee mark, in the site's own language: a flat near-black tile
       carrying two merged chevrons — two upstream components resolved into one
       build — over a short rule in the accent blue. No gradient, no gloss, no
       rim light, so it reads at 16px and matches the rest of the design.

       Not derived from any upstream project's artwork.

       This is a FALLBACK. The official logo at assets/brand/pweevee.png is
       the original render generated by make-app-icon.pl, and
       make-brand-assets.pl derives icon-32/180/512 from its 1024 master;
       this file is only referenced when those derived sizes are absent. -->
  <rect width="64" height="64" rx="14" fill="#080808"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.6">
    <path d="M19 30 32 19.5 45 30"/>
    <path d="M19 42 32 31.5 45 42" stroke-opacity="0.55"/>
  </g>
  <path d="M21 50h22" fill="none" stroke="#90a0d5" stroke-width="3" stroke-linecap="round"/>
</svg>
